name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: mvn -B verify
      - name: Validar template SAM
        uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --region us-east-1
        env:
          AWS_DEFAULT_REGION: us-east-1
