name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # necessário para autenticação OIDC (sem chaves de acesso salvas)
  contents: read

env:
  AWS_REGION: us-east-1
  AMBIENTE: dev
  NOME_STACK: feedback-platform-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - uses: aws-actions/setup-sam@v2

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (infraestrutura + funções)
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$NOME_STACK" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Ambiente="$AMBIENTE" \
              EmailAdministrador="${{ secrets.EMAIL_ADMINISTRADOR }}" \
              EmailRemetente="${{ secrets.EMAIL_REMETENTE }}"
